# ATR (Agent Threat Rules) rule pack for Cisco a2a-scanner
# Source: https://github.com/Agent-Threat-Rule/agent-threat-rules
# 24 signatures across 6 A2A threat categories.
# MIT License. Patterns sourced from ATR rule files; most verbatim, a few
# anchored for the A2A agent-card surface (see README "False-positive hardening").
# ATR source commit: 9f0991c34f359894e79afe2a7657b4c314b34f83 (655-rule set)
pack:
  name: atr
  version: 0.2.0
  description: Open-source AI agent security detection rules from the Agent Threat Rules (ATR) project, mapped to A2A protocol threat categories. 24 signatures across 6 categories, hardened to 0 false positives on the included realistic benign agent-card corpus. MIT license.
  author: ATR Community / Adam Lin
  license: MIT
  source_url: https://github.com/Agent-Threat-Rule/agent-threat-rules
  source_commit: 9f0991c34f359894e79afe2a7657b4c314b34f83
  signature_files:
  - signatures/atr_agent_card_spoofing.yaml
  - signatures/atr_agent_impersonation.yaml
  - signatures/atr_capability_abuse.yaml
  - signatures/atr_data_leakage.yaml
  - signatures/atr_message_injection.yaml
  - signatures/atr_multi_agent_attack.yaml
