# ATR (Agent Threat Rules) rule pack for Cisco a2a-scanner
# Source: https://github.com/Agent-Threat-Rule/agent-threat-rules
# 30 signatures across 6 A2A threat categories.
# MIT License. Patterns extracted verbatim from ATR rule files.
pack:
  name: atr
  version: 0.1.0
  description: Open-source AI agent security detection rules from the Agent Threat Rules (ATR) project, mapped to A2A protocol threat categories. 30 signatures across 6 categories. MIT license.
  author: ATR Community / Adam Lin
  license: MIT
  source_url: https://github.com/Agent-Threat-Rule/agent-threat-rules
  signature_files:
  - signatures/atr_agent_card_spoofing.yaml
  - signatures/atr_agent_impersonation.yaml
  - signatures/atr_capability_abuse.yaml
  - signatures/atr_data_leakage.yaml
  - signatures/atr_message_injection.yaml
  - signatures/atr_multi_agent_attack.yaml
