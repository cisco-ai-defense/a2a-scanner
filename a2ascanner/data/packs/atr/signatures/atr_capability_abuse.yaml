# ATR (Agent Threat Rules) - capability_abuse signatures for a2a-scanner
# Source: https://github.com/Agent-Threat-Rule/agent-threat-rules
# ATR patterns; most extracted verbatim from ATR rule files (MIT License),
# with the SSRF (00013) and financial-action (00098) rules anchored for the
# A2A agent-card surface (see README "False-positive hardening"). 6 signatures.
signatures:
- id: ATR_2026_00013
  atr_id: ATR-2026-00013
  atr_url: https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/tool-poisoning/ATR-2026-00013-tool-ssrf.yaml
  category: capability_abuse
  severity: CRITICAL
  description: 'SSRF via Agent Tool Calls. Detects Server-Side Request Forgery (SSRF) attempts through agent tool calls. Attackers manipulate agents into making requests to internal network endpoints, cloud metadata services, localhost, or private IP ranges through tool parameters. Detection covers: AWS/GCP/Azure/D'
  patterns:
  - (?i)(https?://)?169\.254\.169\.254|/latest/(meta-data|user-data|api/token|dynamic|instance-identity)|X-aws-ec2-metadata-token|amazonaws\.com.{0,50}(credentials|security-credentials|role)|iam[\/\\]security-credentials
  - (?i)(https?://)?metadata\.google\.internal|/computeMetadata/v1|Metadata-Flavor:\s*Google
  - (?i)(https?://)?169\.254\.169\.254/metadata|Metadata:\s*true|api-version=\d{4}-\d{2}-\d{2}.*metadata|management\.azure\.com.{0,50}(subscriptions|resourceGroups)
  - (?i)(https?://)?169\.254\.169\.254/metadata/v1|/opc/v[12]/|100\.100\.100\.200
  - (?i)(https?://)\b(localhost|127\.0\.0\.1|0\.0\.0\.0|\[?::1\]?|0177\.0\.0\.1|0x7f\.0\.0\.1|2130706433)\b(:\d+)?|\b(localhost|127\.0\.0\.1|0\.0\.0\.0|\[?::1\]?|0177\.0\.0\.1|0x7f\.0\.0\.1|2130706433)(:\d+)/|\b(localhost|127\.0\.0\.1|0\.0\.0\.0)(:\d+)(?=\s|$|["'\]}>])
  - (?i)(https?://)?(0x7f000001|0x7f\.0x0\.0x0\.0x1|017700000001|0177\.0000\.0000\.0001|127\.0?0?1|127\.1|0\.0\.0\.0|0x0\.0x0\.0x0\.0x0|0000\.0000\.0000\.0000)
  - (?i)(https?://)?\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b(:\d+)?
  - '(?i)(https?://)?169\.254\.\d{1,3}\.\d{1,3}(:\d+)?|fe80::'
  - (?i)(?:(?:^|[\.@])(?:internal|local|localhost|localdomain|home|corp|intranet|private|lan|cluster\.local|svc\.cluster|consul|vault|etcd|k8s)(?:\:\d+)?(?:/|$)|https?://(?:internal|local|localhost|localdomain|home|corp|intranet|private|lan|cluster\.local|svc\.cluster|consul|vault|etcd|k8s)(?:\:\d+)?(?:/|$))
  - (?i)\b(file|gopher|dict|ftp|tftp|ldap|ldaps|sftp|ssh|telnet|jar|netdoc|mailto|view-source|ws|wss)\s*://\s*(localhost|127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])|192\.168\.|0\.0\.0\.0|\[?::1\]?|0x|0177)
  - (?i)(https?://)?[a-zA-Z0-9-]+\.(xip\.io|nip\.io|sslip\.io|localtest\.me|vcap\.me|lvh\.me|lacolhost\.com|127\.0\.0\.1\.[a-z]+\.\w+)(:\d+)?
  - (?i)(redirect|redir|url|next|return|returnUrl|returnTo|continue|dest|destination|go|goto|target|link|out|view|ref|callback|forward)\s*=\s*(https?%3A%2F%2F|https?://)(localhost|127\.0\.0\.1|10\.|172\.(1[6-9]|2[0-9])|192\.168|169\.254|0\.0\.0|\[?::1\]?)
  - (?i)(https?://)?\[?(::1|::ffff:127\.0\.0\.1|::ffff:10\.|::ffff:172\.(1[6-9]|2[0-9]|3[01])|::ffff:192\.168|fc[0-9a-f]{2}:|fd[0-9a-f]{2}:)\]?(:\d+)?
  - (?i)(https?://)?(\w+\.)?\b(vault\.service\.consul|consul\.service\.consul|etcd\.service|kubernetes\.default\.svc|kube-apiserver|kubelet|elasticsearch|redis|memcached|mysql|postgres|mongodb|rabbitmq|kafka|zookeeper)\b(:\d+|/)
  file_types:
  - json
  - yaml
  - yml
  - txt
  - md
  remediation: Validate and authenticate inter-agent messages before processing; review the flagged field for injected or spoofed content.
- id: ATR_2026_00100
  atr_id: ATR-2026-00100
  atr_url: https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/tool-poisoning/ATR-2026-00100-consent-bypass-instruction.yaml
  category: capability_abuse
  severity: HIGH
  description: Consent Bypass via Hidden LLM Instructions in Tool Descriptions. Detects tool descriptions that embed instructions directing the LLM to automatically forward data to other tools or external endpoints without user confirmation. These instructions bypass normal consent workflows by telling the LLM to
  patterns:
  - (?:always|directly|automatically)\s+(?:pass|send|forward)\s+(?:results?|data|output|them|it|everything)\s+(?:directly\s+)?to\s+(?:the\s+)?\w+\s+(?:without|skip(?:ping)?)\s+(?:asking|requiring|requesting)\s+(?:for\s+)?(?:user|human)\s+(?:confirmation|approval|consent)
  - should\s+be\s+(?:passed|sent|forwarded)\s+directly\s+(?:to\s+(?:the\s+\w+\s+tool\s+)?)?without\s+(?:user|human)\s+(?:confirmation|approval|consent)
  file_types:
  - json
  - yaml
  - yml
  - txt
  - md
  remediation: Validate and authenticate inter-agent messages before processing; review the flagged field for injected or spoofed content.
- id: ATR_2026_00103
  atr_id: ATR-2026-00103
  atr_url: https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/tool-poisoning/ATR-2026-00103-hidden-safety-bypass-instruction.yaml
  category: capability_abuse
  severity: CRITICAL
  description: 'Hidden LLM Safety Bypass Instructions in Tool Descriptions. Detects tools that embed explicit instructions directing the LLM to disregard safety mechanisms, ignore security policies, or bypass previous instructions. Commonly uses patterns like "NOTE TO AI: disregard all safety instructions" to manip'
  patterns:
  - NOTE\s+TO\s+AI:.*(?:disregard|ignore|bypass).*(?:safety|security|previous).*(?:instructions|checks|policies)
  file_types:
  - json
  - yaml
  - yml
  - txt
  - md
  remediation: Validate and authenticate inter-agent messages before processing; review the flagged field for injected or spoofed content.
- id: ATR_2026_00105
  atr_id: ATR-2026-00105
  atr_url: https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/tool-poisoning/ATR-2026-00105-silent-action-concealment.yaml
  category: capability_abuse
  severity: HIGH
  description: Silent Action Concealment Instructions in Tool Descriptions. Detects MCP tools that explicitly instruct the LLM to conceal the tool's own action from the user. Anchored for the A2A surface so the concealment object is the action itself (this/it/the operation), not arbitrary content; benign error-handling such as "do not notify the user about background retries" is excluded.
  patterns:
  - (?:do\s+not|don't|never)\s+(?:mention|tell|inform|notify|reveal)\s+(?:this\s+to\s+)?(?:the\s+)?user\s+(?:this\s+)?(?:as\s+it\s+is|silently|in\s+the\s+background|so\s+(?:the\s+)?user\s+(?:does|doesn't|won't)|that\s+this)
  - (?:do\s+not|don't|never)\s+(?:mention|tell|inform|notify|reveal)\s+(?:the\s+)?user\s+(?:about\s+)?(?:this|it)\b(?:\s+(?:as\s+it\s+is|silently|in\s+the\s+background|so\b))
  - (?:silently|secretly|quietly|without\s+(?:the\s+)?user(?:'s)?\s+(?:knowledge|awareness|consent|notice))\s+(?:perform|execute|run|call|invoke|send|forward|delete|modify)
  file_types:
  - json
  - yaml
  - yml
  - txt
  - md
  remediation: Validate and authenticate inter-agent messages before processing; review the flagged field for injected or spoofed content.
- id: ATR_2026_00106
  atr_id: ATR-2026-00106
  atr_url: https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/tool-poisoning/ATR-2026-00106-schema-description-contradiction.yaml
  category: capability_abuse
  severity: HIGH
  description: Schema-Description Contradiction Attack. Detects tools that claim read-only or safe functionality in their description but expose write-capable or dangerous parameters in their schema. This attack technique uses misleading descriptions to pass security review while the actual schema enables destruct
  patterns:
  - (?:safe|read-only|readonly|read\s+only).*(?:query|operation|access).*write[_-]?mode.*(?:boolean|true|enable)
  file_types:
  - json
  - yaml
  - yml
  - txt
  - md
  remediation: Validate and authenticate inter-agent messages before processing; review the flagged field for injected or spoofed content.
- id: ATR_2026_00098
  atr_id: ATR-2026-00098
  atr_url: https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/excessive-autonomy/ATR-2026-00098-unauthorized-financial-action.yaml
  category: capability_abuse
  severity: CRITICAL
  description: Unauthorized Financial Action by AI Agent. Detects when an AI agent attempts to execute financial operations (payments, transfers, red packets, purchases) without explicit human confirmation. Anchored for the A2A surface to structured financial-action signals (function/tool names, payment-platform send calls, structured action fields, and explicit first-person execution intent with an amount); past-tense status-reporting phrasing such as "payment successful" was removed because it fires on benign billing/reporting agents.
  patterns:
  - (?i)(send_red_packet|send_hongbao|send_money|transfer_money|make_payment|pay_bill|send_payment|create_payment|process_payment|execute_transfer|bank_transfer|wire_transfer|crypto_send|crypto_transfer)
  - (?i)(wechat_pay|alipay|apple_pay|google_pay|stripe_charge|paypal_send|venmo_send|cashapp_send|zelle_send)
  - (?i)("action"\s*:\s*"(pay|transfer|send|withdraw|purchase)"|"type"\s*:\s*"(payment|transfer|withdrawal|purchase)")
  - (?i)(I('ll|\s+will)|let\s+me|going\s+to|about\s+to|proceeding\s+to|executing)\s+(send|transfer|pay|wire|remit|deposit|withdraw)\s+.{0,30}(\$|USD|EUR|CNY|RMB|元|円|원|\d+\.?\d*)
  - (我(将|要|来|來|正在|准备|準備)?|正在|即将|即將).{0,10}(发送|發送|转账|轉帳|支付|付款|汇款|匯款|打款).{0,20}(元|块|塊|美元|人民币|人民幣)
  file_types:
  - json
  - yaml
  - yml
  - txt
  - md
  remediation: Validate and authenticate inter-agent messages before processing; review the flagged field for injected or spoofed content.
